<body class="access-locked">
  <section class="access-gate" id="accessGate" aria-label="Acceso privado a Eventos">
    <div class="access-shell">
      <div class="access-brand">
        <h1>Eventos<span>.</span></h1>
        <p>Acceso privado compartido</p>
      </div>

      <div class="access-copy">Buenas noches<br>Las mejores experiencias comienzan aquí</div>

      <form class="access-card" id="accessForm" autocomplete="off">
        <div class="access-lock" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
        </div>
        <h2>Contraseña</h2>
        <div class="access-field">
          <input id="accessPassword" name="password" type="password" inputmode="numeric" maxlength="4" placeholder="Introduce el código" aria-label="Acceso a Eventos" required />
          <button class="access-eye" id="accessEye" type="button" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
        <button class="access-submit" type="submit">Entrar <span aria-hidden="true">→</span></button>
        <p class="access-error" id="accessError" role="alert"></p>
      </form>

      <div class="access-footer">Eventos exclusivos<br>Espacio privado para dos</div>
    </div>
  </section>

  <main id="app" aria-live="polite" aria-hidden="true"></main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <span class="eyebrow" id="sheetEyebrow">Eventos</span>
        <h2 id="sheetTitle">Añadir</h2>
      </div>
      <button class="icon-button" id="closeSheet" type="button" aria-label="Cerrar">✕</button>
    </div>
    <form class="sheet-form" id="sheetForm"></form>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="./access.js?v=20260909-access-v2"></script>
  <script src="./cloud.js?v=20260909-shared-v3"></script>
  <script src="./app.js?v=20260909-shared-v3"></script>
  <script src="./pwa.js?v=20260909-pwa-v3"></script>
