<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1238" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Eventos" />
  <title>Eventos</title>
  <link rel="manifest" href="https://cdn.jsdelivr.net/gh/fernandoexposito96/Eventos@main/manifest.json" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fernandoexposito96/Eventos@main/styles.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <span class="eyebrow" id="sheetEyebrow">Eventos</span>
        <h2 id="sheetTitle">Añadir</h2>
      </div>
      <button class="icon-button" id="closeSheet" aria-label="Cerrar">✕</button>
    </div>
    <form id="sheetForm" class="sheet-form"></form>
  </section>

  <script src="https://cdn.jsdelivr.net/gh/fernandoexposito96/Eventos@main/app.js"></script>
</body>
</html>
