name: Deploy Eventos to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check cloud-clean.js
          node --check sw.js
      - name: Validate clean entry build
        run: |
          grep -q "cloud-clean.js" index.html
          ! grep -q "cloud-code.js" index.html
          ! grep -q "cloud.css" index.html
          ! grep -q "cloud-gate" index.html
          ! grep -qi "password" index.html
          ! grep -qi "email" index.html
          ! grep -q "codeInviteInput" cloud-clean.js
          ! grep -q "cloudAuthGate" cloud-clean.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
