name: Deploy Eventos to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check cloud.js
          node --check access.js
          node --check pwa.js
          node --check sw.js
      - name: Validate final clean build
        run: |
          grep -q "cloud.js" index.html
          grep -q "access.js" index.html
          grep -q "styles.css" index.html
          test -f manifest-v11.json
          test -f apple-touch-icon-v13.png
          test -f icon-192-v13.png
          test -f icon-512-v13.png
          ! test -e cloud-clean.js
          ! test -e cloud-robust.js
          ! test -e bootstrap.js
          ! test -e visual-final.css
          ! test -e access.css
          ! test -e bottom-nav-final.css
          ! test -e investment-bg-final.css
          ! test -e benefits-bg-final.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
