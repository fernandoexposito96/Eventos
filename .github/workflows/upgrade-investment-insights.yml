name: One-time investment insights upgrade
on:
  push:
    paths:
      - '.github/workflows/upgrade-investment-insights.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply investment upgrade
        run: python .github/scripts/upgrade-investment-insights.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit upgrade
        run: |
          git config user.name "Eventos Investment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js styles.css
          git diff --cached --quiet || git commit -m "Add investment evolution budget and category insights"
          git push
