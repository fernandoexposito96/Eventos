name: One-time Eventos feature upgrade

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/feature-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply upgrade
        run: python3 .github/scripts/upgrade-eventos.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit upgrade
        run: |
          git config user.name 'Eventos Upgrade Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js styles.css index.html
          git diff --cached --check
          git commit -m 'Add full history editing and charts'
          git push origin HEAD:main
