name: One-time Hucha chart order fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-chart-order.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Place savings chart inside history section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='      ${savingsEvolutionChart()}\n      <section class="list-section">\n        <div class="section-head"><h2>Últimas aportaciones</h2>${historyButton(\'savings\')}</div>'
          new='      <section class="list-section">\n        ${savingsEvolutionChart()}\n        <div class="section-head"><h2>Últimas aportaciones</h2>${historyButton(\'savings\')}</div>'
          if old not in s: raise SystemExit('chart order anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check app.js
          git config user.name 'Eventos Upgrade Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js
          git diff --cached --check
          git commit -m 'Place Hucha chart with history content'
          git push origin HEAD:main
