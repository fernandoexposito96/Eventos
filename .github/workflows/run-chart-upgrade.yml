name: Run one-time chart upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-chart-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 .github/scripts/upgrade-chart.py
      - run: node --check app.js
      - run: |
          git config user.name "Eventos Chart Bot"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Upgrade Hucha savings chart visuals"
          git push
      - run: |
          git pull --rebase
          git rm .github/workflows/run-chart-upgrade.yml .github/scripts/upgrade-chart.py
          git commit -m "Remove temporary chart upgrade files"
          git push
