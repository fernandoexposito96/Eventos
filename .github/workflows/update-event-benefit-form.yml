name: One-time event benefit form update
on:
  push:
    paths:
      - '.github/workflows/update-event-benefit-form.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update event benefit form
        run: python .github/scripts/update-event-benefit-form.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "Eventos Benefit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js styles.css
          git diff --cached --quiet || git commit -m "Add benefit input and pending investment assignment"
          git push
