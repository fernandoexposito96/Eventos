name: One-time Beneficios semantics cleanup
on:
  push:
    paths:
      - '.github/workflows/finalize-benefit-semantics.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Finalize Beneficios semantics
        run: python .github/scripts/finalize-benefit-semantics.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "Eventos Benefits Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js styles.css
          git diff --cached --quiet || git commit -m "Finalize net benefit logic and mobile spacing"
          git push
